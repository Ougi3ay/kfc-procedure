        - KFC Procedure: getting-started/concepts/kfc-procedure.md
        - CombinedClassifier: getting-started/concepts/combined-classifier.md
        - MixCOBRA: getting-started/concepts/mixcobra.md
        - GradientCOBRA: getting-started/concepts/gradientcobra.md
  - User Guide:
      - Overview: user-guide/index.md

      - KFC Procedure:
          - Fitting KFC: user-guide/kfc/fitting-kfc.md
          - Regression: user-guide/kfc/regression.md
          - Classification: user-guide/kfc/classification.md
          - Configure K-Step: user-guide/kfc/configuring-k-step.md
          - Configure F-Step: user-guide/kfc/configuring-f-step.md
          - Configure C-Step: user-guide/kfc/configuring-c-step.md
          - Inspect Fitted Models: user-guide/kfc/inspecting-fitted-models.md

      - Clustering:
          - Bregman Divergences: user-guide/clustering/bregman-divergences.md

      - Estimators:
          - Base Estimators: user-guide/estimators/base-estimators.md
          - Estimator Parameters: user-guide/estimators/estimator-parameters.md
          - Custom Estimators: user-guide/estimators/custom-estimators.md

      - Consensus:
          - Overview: user-guide/consensus/overview.md
          - Regression Combiners: user-guide/consensus/regression-combiners.md
          - Classification Combiners: user-guide/consensus/classification-combiners.md
          - Stacking: user-guide/consensus/stacking.md
          - Weighted Mean: user-guide/consensus/weighted-mean.md
          - Majority Vote: user-guide/consensus/majority-vote.md

      - COBRA Components:
          - Prediction Space: user-guide/cobra/prediction-space.md
          - Data Splitting: user-guide/cobra/data-splitting.md
          - Distances: user-guide/cobra/distances.md
          - Kernels: user-guide/cobra/kernels.md
          - Aggregators: user-guide/cobra/aggregators.md
          - Cross-validation: user-guide/cobra/cross-validation.md
          - Loss Functions: user-guide/cobra/losses.md
          - Optimization: user-guide/cobra/optimization.md
          - Gradient Optimization: user-guide/cobra/gradient-optimization.md
          - Normalization: user-guide/cobra/normalization.md

      - Advanced:
          - Precomputed Predictions: user-guide/advanced/precomputed-predictions.md
          - Custom Aggregation Data: user-guide/advanced/custom-aggregation-data.md
          - Parallel Execution: user-guide/advanced/parallel-execution.md
          - Reproducibility: user-guide/advanced/reproducibility.md
          - Extending KFC Procedure: user-guide/advanced/extending-kfc-procedure.md

      - Troubleshooting: user-guide/troubleshooting.md
  - API Reference:
