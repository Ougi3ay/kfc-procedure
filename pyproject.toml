[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "kfc-procedure"
version = "0.1.1"
description = "Clusterwise predictive modeling library"
readme = "README.md"
requires-python = ">=3.11"

authors = [
  { name = "OUGI POV", email = "ougipov113@gmail.com" }
]

dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "xgboost"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]


[project.urls]
Homepage = "https://github.com/Ougi3ay/kfc-procedure"
Documentation = "https://ougi3ay.github.io/kfc-procedure/"
Source = "https://github.com/Ougi3ay/kfc-procedure"
Issues = "https://github.com/Ougi3ay/kfc-procedure/issues"


# --------------------------
# Optional dependencies
# --------------------------

[project.optional-dependencies]

core = [
  "numpy",
  "scikit-learn"
]

cobra = [
  "numba",
  "faiss-cpu",
  "xgboost",
  "pandas",
  "numpy",
  "scikit-learn",
  "matplotlib",
  "plotly"
]

dev = [
  "pytest",
  "pytest-cov",
  "build",
  "twine",
  "jupyter"
]

docs = [
  "mkdocs",
  "mkdocs-material",
  "pymdown-extensions",
  "mkdocstrings[python]"
]


# --------------------------
# setuptools
# --------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfc_procedure*"]


# --------------------------
# pytest
# --------------------------

[tool.pytest.ini_options]

testpaths = [
  "tests"
]

pythonpath = [
  "src"
]

python_files = [
  "test_*.py"
]

python_functions = [
  "test_*"
]

addopts = [
  "-vv",
  "-ra",
  "--strict-markers",
  "--strict-config",
]

markers = [
  "unit: fast isolated unit tests",
  "integration: end-to-end pipeline tests",
  "sklearn: scikit-learn compatibility tests",
]


# --------------------------
# coverage
# --------------------------

[tool.coverage.run]
source = [
  "kfc_procedure"
]
branch = true


[tool.coverage.report]
show_missing = true
skip_covered = true

exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]